[package]
name = "bastion-mcp-http"
version.workspace = true
edition.workspace = true

[dependencies]
axum.workspace = true
bastion-core = { path = "../core" }
bastion-cotizaciones = { path = "../modules/cotizaciones" }
bastion-facturas = { path = "../modules/facturas" }
bastion-mcp = { path = "../mcp" }
bastion-mcp-core = { path = "../mcp-core" }
bastion-ordenes-compra = { path = "../modules/ordenes_compra" }
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
subtle.workspace = true
tokio.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tower-http.workspace = true
url.workspace = true
webpki-roots = "1"

[dev-dependencies]
bastion-core = { path = "../core", features = ["test-support"] }
bastion-cotizaciones = { path = "../modules/cotizaciones" }
bastion-facturas = { path = "../modules/facturas" }
bastion-ordenes-compra = { path = "../modules/ordenes_compra" }
chrono.workspace = true
serde_json.workspace = true
tokio.workspace = true
tower = { version = "0.5", features = ["util"] }
