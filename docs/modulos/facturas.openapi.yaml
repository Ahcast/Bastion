openapi: 3.1.0
info:
  title: Bastion Facturas — borradores sin emisión fiscal
  version: 0.2.0
paths:
  /api/v1/facturas:
    get:
      summary: Listar borradores (facturas/documentos/ver)
      parameters:
        - {name: search, in: query, schema: {type: string, maxLength: 200}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, maximum: 10000, default: 1}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
      responses:
        '200':
          description: Página acotada por creación descendente
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Page'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      summary: Crear borrador (facturas/documentos/editar)
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/Csrf'}
      requestBody: {$ref: '#/components/requestBodies/Input'}
      responses:
        '201': {$ref: '#/components/responses/Draft'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/facturas/calculate:
    post:
      summary: Calcular vista previa sin persistencia (facturas/documentos/editar)
      description: Permite vista previa de contado sin pago; guardar requiere pago total y en este corte solo acepta contado de total cero.
      parameters:
        - {$ref: '#/components/parameters/Csrf'}
      requestBody: {$ref: '#/components/requestBodies/Input'}
      responses:
        '200':
          description: Cálculo del servidor; no emite ni registra pagos
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Calculation'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/facturas/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer, minimum: 1}}
    get:
      summary: Consultar borrador (facturas/documentos/ver)
      responses:
        '200': {$ref: '#/components/responses/Draft'}
        default: {$ref: '#/components/responses/Problem'}
    put:
      summary: Reemplazar borrador con control de versión (facturas/documentos/editar)
      parameters:
        - {$ref: '#/components/parameters/IfMatch'}
        - {$ref: '#/components/parameters/Csrf'}
      requestBody: {$ref: '#/components/requestBodies/Input'}
      responses:
        '200': {$ref: '#/components/responses/Draft'}
        default: {$ref: '#/components/responses/Problem'}
security:
  - session: []
components:
  securitySchemes:
    session: {type: apiKey, in: cookie, name: __Host-bastion_session}
  parameters:
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 16, maxLength: 128, pattern: '^[A-Za-z0-9_-]+$'}}
    IfMatch: {name: If-Match, in: header, required: true, schema: {type: string, pattern: '^"[1-9][0-9]*"$'}}
    Csrf: {name: X-CSRF-Token, in: header, required: true, schema: {type: string}}
  requestBodies:
    Input:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Input'}
  responses:
    Problem:
      description: '400 entrada/cabeceras inválidas o contado sin pago; 422 JSON/DTO inválido; 401 sesión; 403 permiso/CSRF; 404 módulo inactivo/recurso ausente; 409 clave reutilizada; 412 versión; 413 tamaño; 429 cuota; 503 timeout. Origin exacto obligatorio en mutaciones.'
      content:
        application/problem+json:
          schema: {type: object, required: [type, title, status, detail], properties: {type: {type: string}, title: {type: string}, status: {type: integer}, detail: {type: string}}}
    Draft:
      description: Borrador sin numeración, ETag fuerte; creación incluye Location
      headers:
        ETag: {schema: {type: string}}
        Location: {schema: {type: string}}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Draft'}
  schemas:
    Decimal: {type: string, pattern: '^[0-9]{1,12}(\.[0-9]{1,4})?$'}
    DiscountType: {type: string, enum: [amount, percent]}
    Item:
      type: object
      additionalProperties: false
      required: [description, quantity, unit_price, cost_price, discount_type, discount_value, tax_type]
      properties:
        description: {type: string, maxLength: 3000}
        quantity: {$ref: '#/components/schemas/Decimal'}
        unit_price: {$ref: '#/components/schemas/Decimal'}
        cost_price: {$ref: '#/components/schemas/Decimal'}
        discount_type: {$ref: '#/components/schemas/DiscountType'}
        discount_value: {$ref: '#/components/schemas/Decimal'}
        tax_type: {type: string, enum: [none, isv15, isv18]}
        tracking: {type: string, maxLength: 255, default: ''}
        coments: {type: string, maxLength: 1000, default: ''}
    Expense:
      type: object
      additionalProperties: false
      required: [description, amount]
      properties:
        description: {type: string, maxLength: 1000}
        amount: {$ref: '#/components/schemas/Decimal'}
    Input:
      type: object
      additionalProperties: false
      required: [client_name, order_number, invoice_date, payment_term_type, credit_days, discount_type, discount_value, items, expenses, notes, public_notes]
      properties:
        id_client: {type: [integer, 'null'], minimum: 1, default: null, description: Cliente de Bastion; cambiarlo exige Clientes activo y permiso de catálogo}
        client_name: {type: string, maxLength: 255}
        client_rtn: {type: string, maxLength: 30, default: '', description: Instantánea resuelta por el servidor; overrides ignorados al guardar}
        client_email: {type: string, maxLength: 254, default: '', description: Instantánea resuelta por el servidor; overrides ignorados al guardar}
        order_number: {type: string, maxLength: 100}
        invoice_date: {type: string, format: date}
        payment_term_type: {type: string, enum: [contado, credito]}
        credit_days: {type: integer, minimum: 0, maximum: 3650}
        discount_type: {$ref: '#/components/schemas/DiscountType'}
        discount_value: {$ref: '#/components/schemas/Decimal'}
        purchase_order_exempt_number: {type: string, maxLength: 150, default: ''}
        registration_certificate_number: {type: string, maxLength: 150, default: ''}
        sag_registration_number: {type: string, maxLength: 150, default: ''}
        notes: {type: string, maxLength: 3000}
        public_notes: {type: string, maxLength: 3000}
        items: {type: array, maxItems: 200, items: {$ref: '#/components/schemas/Item'}}
        expenses: {type: array, maxItems: 200, items: {$ref: '#/components/schemas/Expense'}}
    Totals:
      type: object
      required: [subtotal, importe_exonerado, importe_exento, importe_gravado_15, importe_gravado_18, descuentos_rebajas, isv_15, isv_18, total]
      properties:
        subtotal: {type: string}
        importe_exonerado: {type: string}
        importe_exento: {type: string}
        importe_gravado_15: {type: string}
        importe_gravado_18: {type: string}
        descuentos_rebajas: {type: string}
        isv_15: {type: string}
        isv_18: {type: string}
        total: {type: string}
    CalculatedItem:
      type: object
      required: [subtotal, unit_discount, item_discount_total, global_line_discount, discount_amount, taxable_base, tax_type, tax_amount, total]
      properties:
        subtotal: {type: string}
        unit_discount: {type: string}
        item_discount_total: {type: string}
        global_line_discount: {type: string}
        discount_amount: {type: string}
        taxable_base: {type: string}
        tax_type: {type: string, enum: [none, isv15, isv18]}
        tax_amount: {type: string}
        total: {type: string, description: Base tras descuento de ítem antes del descuento general e impuesto}
    Calculation:
      type: object
      required: [data, items, totals, product_investment, other_expenses, investment_total, profit, paid_total, balance]
      properties:
        data: {$ref: '#/components/schemas/Input'}
        items: {type: array, items: {$ref: '#/components/schemas/CalculatedItem'}}
        totals: {$ref: '#/components/schemas/Totals'}
        product_investment: {type: string}
        other_expenses: {type: string}
        investment_total: {type: string}
        profit: {type: string}
        paid_total: {type: string, const: '0.00'}
        balance: {type: string}
    Draft:
      type: object
      required: [id, version, status, currency, invoice_number, data, calculation]
      properties:
        id: {type: integer}
        version: {type: integer, minimum: 1}
        status: {type: string, const: Borrador}
        currency: {type: string, const: HNL}
        invoice_number: {type: 'null'}
        data: {$ref: '#/components/schemas/Input'}
        calculation: {$ref: '#/components/schemas/Calculation'}
    Summary:
      type: object
      required: [id, version, client_name, order_number, invoice_date, status, total, balance, item_count]
      properties:
        id: {type: integer}
        version: {type: integer}
        client_name: {type: string}
        order_number: {type: string}
        invoice_date: {type: string, format: date}
        status: {type: string, const: Borrador}
        total: {type: string}
        balance: {type: string}
        item_count: {type: integer}
    Page:
      type: object
      required: [items, page, page_size, has_more]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Summary'}}
        page: {type: integer}
        page_size: {type: integer}
        has_more: {type: boolean}
