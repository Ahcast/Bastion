openapi: 3.1.0
info:
  title: Bastion Gastos
  version: 0.1.0
  description: Primer corte del registro general de gastos. Las reglas marcadas provisionales se describen en gastos-implementacion.md.
servers:
  - url: https://api.bastion.castilloit.net
paths:
  /api/v1/gastos:
    get:
      summary: Listar gastos
      parameters:
        - in: query
          name: search
          schema: { type: string, maxLength: 200 }
          description: Búsqueda literal en factura y proveedor.
        - in: query
          name: date_from
          schema: { type: string, format: date }
        - in: query
          name: date_to
          schema: { type: string, format: date }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, maximum: 10000, default: 1 }
        - in: query
          name: page_size
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: Página de gastos; requiere gastos/registros/ver.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpensePage' }
        '400': { description: Filtro no válido. }
        '401': { description: Sesión requerida. }
        '403': { description: Permiso denegado. }
        '404': { description: Módulo no disponible o desactivado. }
    post:
      summary: Registrar gasto
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 16, maxLength: 128, pattern: '^[A-Za-z0-9_-]+$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpenseInput' }
      responses:
        '201':
          description: Gasto creado; incluye ETag y Location.
          headers:
            ETag: { schema: { type: string } }
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Expense' }
        '400': { description: Datos inválidos. }
        '403': { description: Permiso denegado o CSRF inválido. }
        '409': { description: Clave idempotente reutilizada con otro contenido. }
  /api/v1/gastos/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      summary: Consultar gasto
      responses:
        '200':
          description: Gasto consultado; incluye ETag.
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Expense' }
        '403': { description: Permiso denegado. }
        '404': { description: Gasto o módulo inexistente/no disponible. }
    put:
      summary: Actualizar gasto
      parameters:
        - in: header
          name: If-Match
          required: true
          schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpenseInput' }
      responses:
        '200':
          description: Gasto actualizado; devuelve nuevo ETag.
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Expense' }
        '400': { description: Datos inválidos. }
        '403': { description: Permiso denegado o CSRF inválido. }
        '404': { description: Gasto o módulo inexistente/no disponible. }
        '412': { description: La versión cambió; no se aplicó la actualización. }
    delete:
      summary: Eliminar gasto
      description: Requiere gastos/registros/eliminar y confirmación previa en la interfaz.
      responses:
        '204': { description: Gasto eliminado y acción auditada. }
        '403': { description: Permiso denegado o CSRF inválido. }
        '404': { description: Gasto o módulo inexistente/no disponible. }
components:
  schemas:
    ExpenseInput:
      type: object
      additionalProperties: false
      required: [expense_date, invoice_number, provider, currency, taxable_amount, exempt_amount]
      properties:
        expense_date: { type: string, format: date }
        invoice_number: { type: string, minLength: 1, maxLength: 120 }
        provider: { type: string, minLength: 1, maxLength: 255 }
        currency: { type: string, const: HNL }
        taxable_amount: { type: string, pattern: '^[0-9]{1,12}([.][0-9]{1,4})?$' }
        exempt_amount: { type: string, pattern: '^[0-9]{1,12}([.][0-9]{1,4})?$' }
      description: Una base debe ser mayor que cero. Normalización y cálculo provisional constan en gastos-implementacion.md.
    Expense:
      type: object
      required: [id, version, expense_date, invoice_number, provider, currency, taxable_amount, exempt_amount, isv_15, total]
      properties:
        id: { type: integer, minimum: 1 }
        version: { type: integer, minimum: 1 }
        expense_date: { type: string, format: date }
        invoice_number: { type: string }
        provider: { type: string }
        currency: { type: string, const: HNL }
        taxable_amount: { type: string }
        exempt_amount: { type: string }
        isv_15: { type: string }
        total: { type: string }
    ExpensePage:
      type: object
      required: [items, page, page_size, has_more]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Expense' } }
        page: { type: integer }
        page_size: { type: integer }
        has_more: { type: boolean }
