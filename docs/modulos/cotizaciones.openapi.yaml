openapi: 3.1.0
info:
  title: Bastion Cotizaciones
  version: 0.3.0
  description: Cotizaciones, acciones por documento, PDF Typst y correo inmediato/programado. Conversiones deshabilitadas
    por acuerdo hasta incorporar sus módulos. Ver cotizaciones-acciones.md.
security:
  - session: []
paths:
  /api/v1/cotizaciones:
    get:
      operationId: listQuoteDrafts
      x-permission: cotizaciones/documentos/ver
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 200
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Cotizaciones en orden de fecha e ID descendentes.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - page
                  - page_size
                  - has_more
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Summary"
                  page:
                    type: integer
                  page_size:
                    type: integer
                  has_more:
                    type: boolean
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createQuoteDraft
      x-permission: cotizaciones/documentos/editar
      parameters:
        - $ref: "#/components/parameters/Csrf"
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 128
            pattern: ^[A-Za-z0-9_-]+$
      requestBody:
        $ref: "#/components/requestBodies/Input"
      responses:
        "201":
          description: Creado o respuesta original de creación repetida.
          headers:
            Location:
              schema:
                type: string
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Draft"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/cotizaciones/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      operationId: getQuoteDraft
      x-permission: cotizaciones/documentos/ver
      responses:
        "200":
          description: Borrador con versión para If-Match.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Draft"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: replaceQuoteDraft
      x-permission: cotizaciones/documentos/editar
      parameters:
        - $ref: "#/components/parameters/Csrf"
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
            pattern: ^"[1-9][0-9]*"$
      requestBody:
        $ref: "#/components/requestBodies/Input"
      responses:
        "200":
          description: Borrador actualizado.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Draft"
        "412":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteQuote
      x-permission: cotizaciones/documentos/eliminar
      parameters:
        - &a2
          $ref: "#/components/parameters/Csrf"
        - &a3
          $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: Eliminación confirmada por la UI, auditada y con limpieza privada de sus documentos. Cancela correos
            pendientes; 409 si está enviando.
        "412": &a1
          $ref: "#/components/responses/Problem"
        default: *a1
  /api/v1/cotizaciones/calculate:
    post:
      operationId: calculateQuote
      x-permission: cotizaciones/documentos/editar
      description: Vista previa sin persistencia; mismo cálculo que crear/editar. Cuota común 120 solicitudes por actor/minuto.
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        $ref: "#/components/requestBodies/Input"
      responses:
        "200":
          description: Datos normalizados a dos decimales, vencimiento y desglose calculado por Rust.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Calculation"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/cotizaciones/{id}/status:
    parameters:
      - &a4
        name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    patch:
      operationId: changeQuoteStatus
      x-permission: cotizaciones/documentos/editar
      parameters:
        - *a2
        - *a3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - status
              properties:
                status:
                  $ref: "#/components/schemas/Status"
      responses:
        "200":
          description: Estado actualizado sin reemplazar el contenido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Draft"
        "412": *a1
        default: *a1
  /api/v1/cotizaciones/{id}/clone:
    parameters:
      - *a4
    post:
      operationId: cloneQuote
      x-permission: cotizaciones/documentos/editar
      parameters:
        - *a2
        - *a3
        - &a5
          $ref: "#/components/parameters/Idempotency"
      description: Copia ítems/notas/términos y vigencia; cliente vacío, nuevo número/contacto, Borrador y fecha de Honduras.
        Repetición idempotente devuelve la misma copia.
      responses:
        "201":
          description: Copia guardada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Draft"
        "409": *a1
        "412": *a1
        default: *a1
  /api/v1/cotizaciones/document-readiness:
    get:
      operationId: quoteDocumentReadiness
      x-permission: cotizaciones/documentos/ver
      responses:
        "200":
          description: Disponibilidad de configuración; no expone secretos.
          content:
            application/json:
              schema:
                type: object
                required:
                  - pdf
                  - company
                  - email
                properties:
                  pdf:
                    type: boolean
                  company:
                    type: boolean
                  email:
                    type: boolean
        default: *a1
  /api/v1/cotizaciones/{id}/pdf:
    parameters:
      - *a4
    get:
      operationId: quotePdf
      x-permission: cotizaciones/documentos/ver
      parameters:
        - *a3
      description: Plantilla cotizacion-v1, cálculo guardado, empresa del Core y almacenamiento privado. Misma
        revisión/configuración reutiliza el documento. Tiempo máximo 60 s.
      responses:
        "200":
          description: Documento autorizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pdf"
        "412": *a1
        default: *a1
  /api/v1/cotizaciones/{id}/emails:
    parameters:
      - *a4
    post:
      operationId: queueQuoteEmail
      x-permission: cotizaciones/documentos/editar
      parameters:
        - *a2
        - *a3
        - *a5
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailInput"
      description: Encola un PDF de la revisión exacta. SMTP global, credenciales personales, contenido cifrado. No envía
        desde navegador ni usa SMTP alternativo. Al entregar cambia a Enviada si sigue siendo esa revisión. Sin
        reintentos automáticos de entregas inciertas. Adjuntos adicionales pendientes.
      responses:
        "202":
          description: Envío en cola o programado; consultar estado para confirmar entrega.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailJob"
        "409": *a1
        "412": *a1
        default: *a1
  /api/v1/cotizaciones/{id}/emails/{job}:
    parameters:
      - *a4
      - name: job
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      operationId: quoteEmailStatus
      x-permission: cotizaciones/documentos/ver
      responses:
        "200":
          description: Estado sin contenido ni destinatarios privados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailJob"
        default: *a1
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-bastion_session
  parameters:
    Csrf:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: ^"[1-9][0-9]*"$
    Idempotency:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: ^[A-Za-z0-9_-]+$
  requestBodies:
    Input:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Input"
  responses:
    Problem:
      description: "RFC 9457: 401 sin sesión, 403 sin permiso/CSRF, 404 desactivado/ausente, 409 conflicto de idempotencia,
        412 versión obsoleta, 413 cuerpo, 422 entrada, 429 cuota o 503 timeout/infraestructura."
      content:
        application/problem+json:
          schema:
            type: object
            required:
              - type
              - title
              - status
              - detail
            properties:
              type:
                type: string
              title:
                type: string
              status:
                type: integer
              detail:
                type: string
  schemas:
    Summary:
      type: object
      required:
        - id
        - version
        - client_name
        - order_number
        - quote_date
        - item_count
        - status
      properties:
        id:
          type: integer
        version:
          type: integer
        client_name:
          type: string
        order_number:
          type: string
        quote_date:
          type: string
          format: date
        item_count:
          type: integer
        quote_number:
          type:
            - string
            - "null"
        valid_until:
          type:
            - string
            - "null"
          format: date
        total:
          type:
            - string
            - "null"
        status:
          $ref: "#/components/schemas/Status"
    Discount:
      type: string
      enum:
        - amount
        - percent
    Decimal:
      type: string
      pattern: ^[0-9]{1,12}(\.[0-9]{1,4})?$
    Item:
      type: object
      additionalProperties: false
      required:
        - description
        - quantity
        - unit_price
        - discount_type
        - discount_value
        - tax_type
      properties:
        description:
          type: string
          maxLength: 3000
        quantity:
          $ref: "#/components/schemas/Decimal"
          description: No negativa; se normaliza a dos decimales.
        unit_price:
          $ref: "#/components/schemas/Decimal"
        discount_type:
          $ref: "#/components/schemas/Discount"
        discount_value:
          $ref: "#/components/schemas/Decimal"
          description: Hasta 100 si es porcentaje.
        tax_type:
          type: string
          enum:
            - none
            - isv15
            - isv18
    Input:
      type: object
      additionalProperties: false
      required:
        - client_name
        - order_number
        - quote_date
        - valid_days
        - notes
        - terms
        - discount_type
        - discount_value
        - items
      properties:
        client_name:
          type: string
          maxLength: 255
        order_number:
          type: string
          maxLength: 100
        quote_date:
          type: string
          format: date
        valid_days:
          type: integer
          minimum: 0
          maximum: 3650
        status:
          $ref: "#/components/schemas/Status"
        contact_email:
          type: string
          readOnly: true
          description: Lo determina el Core al crear; el cliente no lo sustituye.
        prepared_by_name:
          type: string
          readOnly: true
          description: Contacto original conservado al editar.
        notes:
          type: string
          maxLength: 3000
        terms:
          type: string
          maxLength: 5000
        discount_type:
          $ref: "#/components/schemas/Discount"
        discount_value:
          $ref: "#/components/schemas/Decimal"
        purchase_order_exempt_number:
          type: string
          maxLength: 150
          default: ""
        registration_certificate_number:
          type: string
          maxLength: 150
          default: ""
        sag_registration_number:
          type: string
          maxLength: 150
          default: ""
        items:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/Item"
    Status:
      type: string
      enum:
        - Borrador
        - Enviada
        - Aprobada
        - Rechazada
        - Convertido
    Money:
      type: string
      pattern: ^-?[0-9]+[.][0-9]{2}$
    Totals:
      type: object
      required:
        - subtotal
        - importe_exonerado
        - importe_exento
        - importe_gravado_15
        - importe_gravado_18
        - descuentos_rebajas
        - isv_15
        - isv_18
        - total
      properties:
        subtotal:
          $ref: "#/components/schemas/Money"
        importe_exonerado:
          $ref: "#/components/schemas/Money"
        importe_exento:
          $ref: "#/components/schemas/Money"
        importe_gravado_15:
          $ref: "#/components/schemas/Money"
        importe_gravado_18:
          $ref: "#/components/schemas/Money"
        descuentos_rebajas:
          $ref: "#/components/schemas/Money"
        isv_15:
          $ref: "#/components/schemas/Money"
        isv_18:
          $ref: "#/components/schemas/Money"
        total:
          $ref: "#/components/schemas/Money"
    CalculatedItem:
      type: object
      required:
        - subtotal
        - unit_discount
        - item_discount_total
        - global_line_discount
        - discount_amount
        - taxable_base
        - tax_type
        - tax_amount
        - total
      properties:
        subtotal:
          $ref: "#/components/schemas/Money"
        unit_discount:
          $ref: "#/components/schemas/Money"
        item_discount_total:
          $ref: "#/components/schemas/Money"
        global_line_discount:
          $ref: "#/components/schemas/Money"
        discount_amount:
          $ref: "#/components/schemas/Money"
        taxable_base:
          $ref: "#/components/schemas/Money"
        tax_type:
          type: string
          enum:
            - none
            - isv15
            - isv18
        tax_amount:
          $ref: "#/components/schemas/Money"
        total:
          $ref: "#/components/schemas/Money"
          description: Base tras descuento de ítem; no incluye descuento general ni impuesto.
    Calculation:
      type: object
      required:
        - data
        - valid_until
        - items
        - totals
      properties:
        data:
          $ref: "#/components/schemas/Input"
        valid_until:
          type: string
          format: date
        items:
          type: array
          items:
            $ref: "#/components/schemas/CalculatedItem"
        totals:
          $ref: "#/components/schemas/Totals"
    Draft:
      type: object
      required:
        - id
        - version
        - status
        - currency
        - data
        - quote_number
        - calculation
      properties:
        id:
          type: integer
        version:
          type: integer
        status:
          $ref: "#/components/schemas/Status"
        currency:
          const: HNL
        quote_number:
          type:
            - string
            - "null"
          readOnly: true
        calculation:
          $ref: "#/components/schemas/Calculation"
        data:
          $ref: "#/components/schemas/Input"
    Pdf:
      type: object
      required:
        - filename
        - mime
        - content_base64
      properties:
        filename:
          type: string
        mime:
          const: application/pdf
        content_base64:
          type: string
          contentEncoding: base64
          description: PDF privado, máximo 8 MiB; no incluye notas privadas ni URL pública de S3.
    EmailInput:
      type: object
      additionalProperties: false
      required:
        - to
        - cc
        - bcc
        - subject
        - message
        - scheduled_at
      properties:
        to:
          type: string
          maxLength: 255
        cc:
          type: string
          maxLength: 1000
        bcc:
          type: string
          maxLength: 1000
        subject:
          type: string
          maxLength: 255
        message:
          type: string
          maxLength: 5000
        scheduled_at:
          type:
            - string
            - "null"
          format: date-time
          description: Zona explícita. Vacío, nulo o pasado envía ahora. La UI convierte desde Honduras. Al menos un destino
            válido entre Para/CC/CCO; máximo técnico 50 destinos distintos.
    EmailJob:
      type: object
      required:
        - id
        - delivery_status
        - scheduled_at
        - last_error_code
      properties:
        id:
          type: integer
        delivery_status:
          type: string
          enum:
            - pending
            - delivering
            - sent
            - failed
            - cancelled
        scheduled_at:
          type: string
          description: Fecha/hora UTC sin sufijo, serializada desde DATETIME(6).
        last_error_code:
          type:
            - string
            - "null"
