openapi: 3.1.0
info:
  title: Infraestructura de Licitaciones y biblioteca de formularios
  version: 0.1.0
  description: Sin formularios ni campos de negocio precargados. Ver licitaciones-infraestructura.md para límites, autorización y pendientes.
security:
  - session: []
paths:
  /api/v1/licitaciones:
    get:
      summary: Listar expedientes de empresa con permiso licitaciones/expedientes/ver
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Página autorizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpedientPage'
    post:
      summary: Crear expediente vacío en Borrador; requiere editar
      parameters:
        - $ref: '#/components/parameters/Idempotency'
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '201':
          description: Expediente creado o recibo idéntico; ETag fuerte
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Expedient' }
        '409': { description: Clave reutilizada con otro cuerpo }
  /api/v1/licitaciones/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      summary: Leer expediente y sus copias; requiere ver
      responses:
        '200':
          description: Expediente con ETag fuerte
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Expedient' }
    patch:
      summary: Cambiar el nombre de un expediente Borrador; requiere editar
      parameters:
        - $ref: '#/components/parameters/Version'
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 255, description: Se recortan espacios externos; no se admiten nombres vacíos ni caracteres de control. }
      responses:
        '200':
          description: Expediente actualizado con ETag fuerte; el ID se conserva
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Expedient' }
        '400': { description: Nombre inválido o campos no admitidos }
        '403': { description: Sin permiso de edición }
        '409': { description: Expediente fuera de Borrador }
        '412': { description: Versión obsoleta }
    delete:
      summary: Eliminar lógicamente sólo Borrador; requiere eliminar
      parameters:
        - $ref: '#/components/parameters/Version'
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirm_id]
              properties:
                confirm_id: { type: integer, minimum: 1 }
      responses:
        '204': { description: Eliminado sin destruir recibos ni historial }
        '409': { description: Estado distinto de Borrador }
        '412': { description: Versión obsoleta }
  /api/v1/licitaciones/{id}/formularios:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      summary: Copiar esquema publicado; editar expediente y leer Colaboración/empresa activa
      parameters:
        - $ref: '#/components/parameters/Idempotency'
        - $ref: '#/components/parameters/Version'
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [source_id, revision]
              properties:
                source_id: { type: integer, minimum: 1 }
                revision: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Expediente actualizado con copia independiente; ETag fuerte
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Expedient' }
        '409': { description: Clave reutilizada o expediente bloqueado }
        '412': { description: Versión obsoleta }
  /api/v1/licitaciones/{id}/formularios/{copy_id}/valores:
    parameters:
      - $ref: '#/components/parameters/Id'
      - name: copy_id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    put:
      summary: Sustituir sólo valores declarados de una copia perteneciente al expediente
      parameters:
        - $ref: '#/components/parameters/Version'
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [values]
              properties:
                values: { type: object, additionalProperties: { type: [string, boolean] } }
      responses:
        '200':
          description: Expediente actualizado; cada copia incluye missing_required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Expedient' }
        '412': { description: Versión obsoleta }
  /api/v1/colaboracion/formularios:
    get:
      summary: Listar últimas revisiones publicadas; requiere ver Colaboración/empresa
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Página de esquemas publicados; catálogo inicialmente vacío
          content:
            application/json:
              schema:
                type: object
                required: [items, page, page_size, has_more]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/PublishedForm' } }
                  page: { type: integer }
                  page_size: { type: integer }
                  has_more: { type: boolean }
    post:
      summary: Publicar esquema inmutable; exclusivo del Administrador del sistema
      parameters:
        - $ref: '#/components/parameters/Idempotency'
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [definition]
              properties:
                form_id: { type: [integer, 'null'], minimum: 1 }
                expected_revision: { type: [integer, 'null'], minimum: 1 }
                definition: { $ref: '#/components/schemas/FormDefinition' }
      responses:
        '201':
          description: Revisión publicada o recibo idéntico
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublishedForm' }
        '403': { description: Un rol personalizado no publica aunque tenga editar o comodín }
        '409': { description: Clave reutilizada con otro cuerpo }
        '412': { description: Revisión anterior cambió }
  /api/v1/licitaciones/{id}/archivos:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      summary: Metadatos privados de archivos legales/técnicos; requiere ver
      responses:
        '200':
          description: Archivos, versión y bytes retenidos incluidos los objetos pendientes de limpieza
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttachmentList' }
    post:
      summary: Subir PDF o imagen desde PC; requiere editar y Borrador
      parameters:
        - $ref: '#/components/parameters/Version'
        - $ref: '#/components/parameters/Idempotency'
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [section, filename, content_base64]
              properties:
                section: { $ref: '#/components/schemas/AttachmentSection' }
                filename: { type: string, minLength: 1, maxLength: 255 }
                content_base64: { type: string, maxLength: 26666668, description: Máximo real de 20000000 bytes; extensión y MIME se validan en servidor. }
      responses:
        '200': { $ref: '#/components/responses/FileWrite' }
        '400': { description: Tipo, tamaño o presupuesto de expediente inválido }
        '409': { description: Clave reutilizada con otro archivo o estado distinto de Borrador }
        '412': { description: Versión obsoleta }
        '413': { description: Cuerpo mayor de 27000000 bytes }
        '503': { description: Almacenamiento no disponible o concurrencia agotada; el objeto reservado se recupera por limpieza }
  /api/v1/licitaciones/{id}/archivos/desde-colaboracion:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      summary: Copia independiente de PDF/imagen autorizada de Colaboración activa
      parameters:
        - $ref: '#/components/parameters/Version'
        - $ref: '#/components/parameters/Idempotency'
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [section, source_id]
              properties:
                section: { $ref: '#/components/schemas/AttachmentSection' }
                source_id: { type: integer, minimum: 1 }
      responses:
        '200': { $ref: '#/components/responses/FileWrite' }
        '404': { description: Origen no disponible o sin acceso }
        '412': { description: Versión obsoleta }
  /api/v1/licitaciones/{id}/archivos/{attachment}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/AttachmentId'
    delete:
      summary: Quitar copia de Borrador; requiere eliminar y no modifica el origen
      parameters:
        - $ref: '#/components/parameters/Version'
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirm_id]
              properties:
                confirm_id: { type: string, pattern: '^[a-f0-9]{48}$' }
      responses:
        '200': { $ref: '#/components/responses/FileWrite' }
        '409': { description: Fuera de Borrador }
        '412': { description: Versión obsoleta }
  /api/v1/licitaciones/{id}/archivos/{attachment}/preview:
    parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/AttachmentId'
    get:
      summary: Leer copia privada con MIME verificado; requiere ver
      responses:
        '200': { $ref: '#/components/responses/FileContent' }
        '404': { description: No pertenece al expediente, eliminado o sin acceso }
  /api/v1/licitaciones/{id}/archivos/{attachment}/download:
    parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/AttachmentId'
    get:
      summary: Descargar bytes originales privados como octet-stream; requiere ver
      responses:
        '200': { $ref: '#/components/responses/FileContent' }
        '404': { description: No pertenece al expediente, eliminado o sin acceso }
components:
  responses:
    FileWrite:
      description: Expediente vigente con ETag fuerte; reintentar no duplica el archivo
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Expedient' }
    FileContent:
      description: Archivo privado autorizado y validado por hash y tamaño
      content:
        application/json:
          schema:
            type: object
            required: [filename, mime, content_base64]
            properties:
              filename: { type: string }
              mime: { type: string }
              content_base64: { type: string }
  securitySchemes:
    session: { type: apiKey, in: cookie, name: __Host-bastion_session }
  parameters:
    AttachmentId: { name: attachment, in: path, required: true, schema: { type: string, pattern: '^[a-f0-9]{48}$' } }
    Id: { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 10000, default: 1 } }
    PageSize: { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
    Version: { name: If-Match, in: header, required: true, schema: { type: string, pattern: '^"[1-9][0-9]*"$' } }
    Idempotency: { name: Idempotency-Key, in: header, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{16,128}$' } }
    Csrf: { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
  schemas:
    AttachmentSection: { type: string, enum: [legal, tecnica] }
    Attachment:
      type: object
      required: [id, section, filename, mime, byte_size, sha256, source_id, source_sha256, created_at]
      properties:
        id: { type: string, pattern: '^[a-f0-9]{48}$' }
        section: { $ref: '#/components/schemas/AttachmentSection' }
        filename: { type: string }
        mime: { type: string }
        byte_size: { type: integer, minimum: 1, maximum: 20000000 }
        sha256: { type: string }
        source_id: { type: [integer, 'null'] }
        source_sha256: { type: [string, 'null'] }
        created_at: { type: string }
    AttachmentList:
      type: object
      required: [items, expedient_version, retained_bytes]
      properties:
        items: { type: array, maxItems: 1000, items: { $ref: '#/components/schemas/Attachment' } }
        expedient_version: { type: integer }
        retained_bytes: { type: integer }
    FormDefinition:
      type: object
      additionalProperties: false
      required: [title, section, variables]
      properties:
        title: { type: string, minLength: 1, maxLength: 255 }
        section: { type: string, enum: [legal, economica, tecnica] }
        variables:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [key, label, kind, required]
            properties:
              key: { type: string, pattern: '^[a-z][a-z0-9_]{0,63}$' }
              label: { type: string, minLength: 1, maxLength: 255 }
              kind: { type: string, enum: [text, integer, decimal, date, boolean] }
              required: { type: boolean }
    PublishedForm:
      type: object
      required: [id, revision, hash, definition]
      properties:
        id: { type: integer }
        revision: { type: integer }
        hash: { type: string, pattern: '^[a-f0-9]{64}$' }
        definition: { $ref: '#/components/schemas/FormDefinition' }
    FormCopy:
      type: object
      required: [id, source, values, missing_required]
      properties:
        id: { type: integer }
        source: { $ref: '#/components/schemas/PublishedForm' }
        values: { type: object, additionalProperties: { type: [string, boolean] } }
        missing_required: { type: array, items: { type: string } }
    Expedient:
      type: object
      required: [id, name, version, state, forms]
      properties:
        id: { type: integer }
        version: { type: integer }
        state: { type: string, enum: [borrador] }
        forms: { type: array, items: { $ref: '#/components/schemas/FormCopy' } }
        name: { type: string, maxLength: 255, description: Vacío mientras no se asigne; independiente del ID técnico. }
    ExpedientPage:
      type: object
      required: [items, page, page_size, has_more]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, name, version, state]
            properties:
              id: { type: integer }
              version: { type: integer }
              state: { type: string }
              name: { type: string, maxLength: 255 }
        page: { type: integer }
        page_size: { type: integer }
        has_more: { type: boolean }
