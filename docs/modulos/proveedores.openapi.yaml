openapi: 3.1.0
info:
  title: Bastion Proveedores API
  version: 0.1.0
  description: >-
    Primer corte del catálogo nuevo de proveedores. No importa datos ni IDs del Legacy.
    Las escrituras usan la sesión, el origen y el token X-CSRF-Token gestionados por Core.
servers:
  - url: https://api.bastion.castilloit.net
security:
  - bastionSession: []
paths:
  /api/v1/proveedores:
    get:
      summary: Buscar y paginar proveedores
      x-permission: proveedores/catalogo/ver
      parameters:
        - in: query
          name: search
          schema: { type: string, maxLength: 200 }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, maximum: 10000, default: 1 }
        - in: query
          name: page_size
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: Página del catálogo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupplierPage' }
        '401': { description: Sesión requerida. }
        '403': { description: Permiso insuficiente. }
        '404': { description: Módulo deshabilitado. }
        '429': { description: Cuota de solicitudes por actor alcanzada. }
    post:
      summary: Crear proveedor
      x-permission: proveedores/catalogo/editar
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 16, maxLength: 128, pattern: '^[A-Za-z0-9_-]+$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupplierInput' }
      responses:
        '201':
          description: Proveedor creado; la respuesta incluye ETag y Location.
          headers:
            ETag: { schema: { type: string } }
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Supplier' }
        '400': { description: Cuerpo, campo o clave idempotente inválidos. }
        '409': { description: Clave idempotente reutilizada con otro cuerpo. }
        '429': { description: Cuota de solicitudes por actor alcanzada. }
  /api/v1/proveedores/catalogo:
    get:
      summary: Consultar catálogo resumido para selectores
      x-permission: proveedores/catalogo/ver
      parameters:
        - in: query
          name: search
          schema: { type: string, maxLength: 200 }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, maximum: 10000, default: 1 }
        - in: query
          name: page_size
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: Página con ID y nombre únicamente.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogPage' }
        '401': { description: Sesión requerida. }
        '403': { description: Permiso insuficiente. }
        '404': { description: Módulo deshabilitado. }
        '429': { description: Cuota de solicitudes por actor alcanzada. }
  /api/v1/proveedores/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      summary: Consultar proveedor
      x-permission: proveedores/catalogo/ver
      responses:
        '200':
          description: Proveedor y versión actual (ETag).
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Supplier' }
        '404': { description: Registro ausente o módulo deshabilitado. }
        '429': { description: Cuota de solicitudes por actor alcanzada. }
    put:
      summary: Reemplazar campos del proveedor
      x-permission: proveedores/catalogo/editar
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
        - in: header
          name: If-Match
          required: true
          schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupplierInput' }
      responses:
        '200':
          description: Proveedor actualizado; incluye ETag nuevo.
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Supplier' }
        '400': { description: ID, If-Match, cuerpo o campo inválidos. }
        '412': { description: La versión cambió y la edición fue rechazada. }
        '429': { description: Cuota de solicitudes por actor alcanzada. }
components:
  securitySchemes:
    bastionSession:
      type: apiKey
      in: cookie
      name: __Host-bastion_session
  schemas:
    SupplierInput:
      type: object
      additionalProperties: false
      required: [supplier_name]
      properties:
        supplier_name: { type: string, minLength: 1, maxLength: 255 }
        user_contact: { type: string, maxLength: 255, default: '' }
        email: { type: string, maxLength: 254, default: '' }
        rtn: { type: string, maxLength: 100, default: '' }
        phone_number: { type: string, maxLength: 60, default: '' }
        mobile_number: { type: string, maxLength: 60, default: '' }
        direction: { type: string, maxLength: 1500, default: '' }
    Supplier:
      allOf:
        - $ref: '#/components/schemas/SupplierInput'
        - type: object
          required: [id, version]
          properties:
            id: { type: integer, minimum: 1 }
            version: { type: integer, minimum: 1 }
    CatalogSupplier:
      type: object
      required: [id, supplier_name]
      properties:
        id: { type: integer, minimum: 1 }
        supplier_name: { type: string }
    SupplierPage:
      type: object
      required: [items, page, page_size, has_more]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Supplier' } }
        page: { type: integer }
        page_size: { type: integer }
        has_more: { type: boolean }
    CatalogPage:
      type: object
      required: [items, page, page_size, has_more]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CatalogSupplier' } }
        page: { type: integer }
        page_size: { type: integer }
        has_more: { type: boolean }
