openapi: 3.1.0
info:
  title: Bastion Procesos (contrato del módulo habilitado)
  version: 0.1.0
security:
  - session: []
paths:
  /api/v1/procesos/scout-status:
    get:
      operationId: procesosScoutStatus
      x-limits: {main_bytes: 32768, stage_bytes: 524288, timeout_seconds: 60, concurrency: 1}
      x-permission: procesos/consulta/ver
      description: Información de solo lectura para Ajustes > Procesos. Lee únicamente main.json, scout.json, combiner.json y clasificador.json junto al maestro configurado en el servidor. No ejecuta Scout, IA ni importación. No admite parámetros. Proyección de campos operativos conocidos; no devuelve JSON crudo, rutas, URLs de pendientes, configuración ni errores de texto libre. Cada reporte indica disponibilidad y si corresponde al ciclo de main; ausencia no significa éxito ni cero.
      responses:
        '200':
          description: Instantánea de reportes locales; archivos ausentes, inválidos, cambiantes o sin lectura se indican por separado sin ocultar los demás.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ScoutDiagnostics'}
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/procesos/status:
    get:
      operationId: procesosStatus
      x-permission: procesos/consulta/ver
      parameters:
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Entidad'
        - $ref: '#/components/parameters/Marked'
        - $ref: '#/components/parameters/HideMunicipalities'
        - $ref: '#/components/parameters/Desde'
        - $ref: '#/components/parameters/Hasta'
      responses:
        '200':
          description: Estadísticas globales de todo lo importado, incluidos vencidos y municipalidades. Los filtros se aceptan por compatibilidad pero se ignoran. Nuevos por semana suma inserted de recibos confirmados según created_at (primera incorporación en Bastion, sin repetir actualizaciones o reimportaciones). Entregas de tres días según fecha_recepcion, incluso horas ya vencidas de hoy. Calendario America/Tegucigalpa.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Status'}
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/procesos/entities:
    get:
      operationId: procesosEntities
      x-permission: procesos/consulta/ver
      responses:
        '200':
          description: Entidades distintas del histórico CSV, ordenadas por nombre y excluyendo nombres municipales. Independiente de los filtros activos. Máximo 5000; se rechaza el exceso sin truncar.
          content:
            application/json:
              schema:
                type: object
                required: [entities]
                properties:
                  entities:
                    type: array
                    maxItems: 5000
                    items: {type: string, maxLength: 500}
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/procesos/rows:
    get:
      operationId: procesosRows
      x-permission: procesos/consulta/ver
      parameters:
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Entidad'
        - $ref: '#/components/parameters/Desde'
        - $ref: '#/components/parameters/Hasta'
        - $ref: '#/components/parameters/Marked'
        - $ref: '#/components/parameters/HideMunicipalities'
        - $ref: '#/components/parameters/Sort'
        - name: page
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: page_size
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 25}
      responses:
        '200':
          description: Solo vigentes (fecha_recepcion estrictamente posterior al instante UTC del servidor). items, total filtrado de vigentes, page, page_size, has_more y server_time. Orden solicitado y proceso_id ASC como desempate estable. Fechas UTC RFC 3339; al vencer deja de aparecer sin borrar su histórico.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Page'}
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/procesos/rows/{id}:
    get:
      operationId: procesosDetail
      x-permission: procesos/consulta/ver
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, pattern: '^hc:[a-f0-9]{64}$'}
      responses:
        '200':
          description: Registro vigente con campos fuente completos, marked, note y version compartidos; ETag con versión. Vencido devuelve 404. Resultado IA como texto/JSON; no descarga enlaces externos.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Process'}
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/procesos/rows/{id}/review:
    patch:
      operationId: procesosReview
      x-permission: procesos/marcas/editar para marked; procesos/notas/editar para note
      description: Marca y nota compartidas. Conservadas al importar Scout. Al menos un campo requerido; no permite campos fuente ni actor. Auditoría sin texto de nota.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, pattern: '^hc:[a-f0-9]{64}$'}
        - name: If-Match
          in: header
          required: true
          description: Versión del registro entre comillas, recibida en ETag/version del detalle/listado.
          schema: {type: string}
        - name: X-CSRF-Token
          in: header
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                marked: {type: boolean}
                note: {type: string, maxLength: 10000}
      responses:
        '200':
          description: marked, note y version actualizados; ETag nuevo.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Review'}
        '412':
          description: Otro usuario cambió la revisión; recargar. No sobrescribe.
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/procesos/refresh:
    post:
      operationId: procesosRefresh
      x-permission: procesos/importacion/editar
      x-limits: {csv_bytes: 8388608, request_bytes: 1048576, rows: 5000, timeout_seconds: 60, concurrency: 1}
      description: Actualizar incorpora el maestro local configurado en el servidor tras verificar main.json, finalización del intento, SHA-256 y cantidad de filas. Una entrega parcial finalizada incorpora solo filas con extracción completa y análisis vigente sin error; deferred cuenta las demás. No acepta rutas ni CSV. Auditoría de la fuente completa e idempotencia por usuario y SHA-256 del subconjunto listo. Repetir devuelve el recibo previo; ausencias no borran filas ni marcas/notas. Funciona sin el trabajador periódico. Sustituye el endpoint de carga de archivos.
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              maxProperties: 0
      responses:
        '200':
          description: import_id, inserted, updated, unchanged, stale, replayed y deferred. Confirmación transaccional con auditoría.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportResult'}
        '409':
          description: Scout no publicó filas listas en una entrega finalizada o la entrega cambió durante la lectura; reintentar después.
        '422':
          description: El maestro o manifiesto no cumple el contrato; no se importó ninguna fila.
        '503':
          description: La fuente local no está disponible o no tiene permisos de lectura.
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/procesos/export:
    get:
      operationId: procesosExport
      x-permission: procesos/exportacion/ver
      x-limits: {rows: 5000, response_bytes: 16777216, timeout_seconds: 60, concurrency: 1}
      parameters:
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Entidad'
        - $ref: '#/components/parameters/Desde'
        - $ref: '#/components/parameters/Hasta'
        - $ref: '#/components/parameters/Marked'
        - $ref: '#/components/parameters/HideMunicipalities'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Solo vigentes con filtros y orden solicitados. JSON csv_text con CSV UTF-8 BOM, encabezados Scout seguidos de de_interes (0/1) y nota compartida; celdas potencialmente ejecutables en hojas de cálculo prefijadas con apóstrofo. No sustituye el maestro original de Scout.
          content:
            application/json:
              schema:
                type: object
                required: [csv_text]
                properties:
                  csv_text: {type: string}
        '409':
          description: Más de 5.000 filas o 16 MiB; acotar filtros. No se trunca el resultado.
        default:
          $ref: '#/components/responses/Problem'
components:
  schemas:
    ScoutDiagnostics:
      type: object
      required: [checked_at, reports]
      properties:
        checked_at: {type: string, format: date-time}
        reports:
          type: array
          minItems: 4
          maxItems: 4
          items:
            type: object
            required: [stage, availability, matches_current_run, run]
            properties:
              stage: {type: string, enum: [main, scout, combiner, clasificador]}
              availability: {type: string, enum: [available, missing, unreadable, invalid, changed]}
              matches_current_run: {type: [boolean, 'null']}
              run:
                oneOf:
                  - type: 'null'
                  - type: object
                    required: [run_id, status, started_at, finished_at, deadline, duration_seconds, output_ready, reason, retry_stages, metrics, error_reported]
                    properties:
                      run_id: {type: string, maxLength: 120}
                      status: {type: string, enum: [ejecutando, exitoso, parcial, error, desconocido]}
                      started_at: {type: [string, 'null'], format: date-time}
                      finished_at: {type: [string, 'null'], format: date-time}
                      deadline: {type: [string, 'null'], format: date-time}
                      duration_seconds: {type: [integer, 'null'], minimum: 0}
                      output_ready: {type: [boolean, 'null']}
                      reason: {type: [string, 'null'], description: Código operativo conocido o other; nunca texto de excepción.}
                      retry_stages:
                        type: array
                        maxItems: 3
                        items: {type: string, enum: [scout, combiner, clasificador]}
                      metrics:
                        type: object
                        additionalProperties: {type: integer, minimum: 0}
                        description: Solo contadores conocidos por etapa y input_tokens/output_tokens de usage; campos ausentes no se sustituyen por cero.
                      error_reported: {type: boolean}
    Status:
      type: object
      required: [total, last_import_at, as_of, timezone, due, weekly]
      properties:
        total: {type: integer, minimum: 0}
        last_import_at: {type: [string, 'null'], format: date-time}
        as_of: {type: string, format: date}
        timezone: {type: string, const: America/Tegucigalpa}
        due:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: object
            required: [date, count]
            properties:
              date: {type: string, format: date}
              count: {type: integer, minimum: 0}
        weekly:
          type: array
          minItems: 6
          maxItems: 6
          items:
            type: object
            required: [week_start, count]
            properties:
              week_start: {type: string, format: date}
              count: {type: integer, minimum: 0}
    Review:
      type: object
      required: [marked, note, version]
      properties:
        marked: {type: boolean}
        note: {type: string, maxLength: 10000}
        version: {type: integer, minimum: 0}
    Process:
      allOf:
        - $ref: '#/components/schemas/Review'
        - type: object
          required: [proceso_id, entidad, expediente, fecha_recepcion, puntaje, rubro, resumen_corto, source]
          properties:
            proceso_id: {type: string, pattern: '^hc:[a-f0-9]{64}$'}
            entidad: {type: string, maxLength: 500}
            expediente: {type: string, maxLength: 255}
            fecha_recepcion: {type: string, format: date-time}
            puntaje: {type: integer, minimum: 0, maximum: 100}
            rubro: {type: string, maxLength: 500}
            resumen_corto: {type: string, maxLength: 16384}
            source:
              type: object
              description: Vacío en listados; las 24 columnas de Scout con sus textos exactos en el detalle. Scout actual usa resumen e items numerados; el formato anterior usa resumen_corto e items JSON. items_fuente conserva JSON serializado como texto.
              additionalProperties: {type: string}
    Page:
      type: object
      required: [items, total, server_time, page, page_size, has_more]
      properties:
        items:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/Process'}
        page: {type: integer, minimum: 1, maximum: 100000}
        page_size: {type: integer, minimum: 1, maximum: 100}
        has_more: {type: boolean}
        total: {type: integer, minimum: 0, description: Total de vigentes que coinciden con filtros antes de paginar.}
        server_time: {type: string, format: date-time, description: Instante UTC usado como corte de vigencia de la página.}
    ImportResult:
      type: object
      required: [import_id, inserted, updated, unchanged, stale, replayed, deferred]
      properties:
        import_id: {type: integer, minimum: 1}
        inserted: {type: integer, minimum: 0}
        updated: {type: integer, minimum: 0}
        unchanged: {type: integer, minimum: 0}
        stale: {type: integer, minimum: 0}
        replayed: {type: boolean}
        deferred: {type: integer, minimum: 0, description: Filas de la publicación fuente que esperan completar extracción o análisis y no se incorporaron.}
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-bastion_session
  parameters:
    HideMunicipalities:
      name: hide_municipalities
      in: query
      schema: {type: boolean, default: false}
      description: Excluye entidades con palabras municipalidad(es), alcaldía(s), municipio(s) o municipal(es) en su nombre; no deduce localidad por expediente.
    Sort:
      name: sort
      in: query
      schema: {type: string, enum: [fecha_desc, fecha_asc, puntaje_desc, puntaje_asc], default: fecha_desc}
    Marked:
      name: marked
      in: query
      schema: {type: boolean}
    Q:
      name: q
      in: query
      schema: {type: string, maxLength: 200}
      description: Texto literal en expediente, descripción e items_fuente del CSV; estos dos últimos son el contenido fuente disponible para especificaciones. No busca por texto IA.
    Entidad:
      name: entidad
      in: query
      schema: {type: string, maxLength: 500}
      description: Coincidencia exacta del nombre seleccionado.
    Desde:
      name: desde
      in: query
      description: Primer día de recepción, inclusivo en America/Tegucigalpa.
      schema: {type: string, format: date}
    Hasta:
      name: hasta
      in: query
      description: Último día de recepción, inclusivo en America/Tegucigalpa.
      schema: {type: string, format: date}
  responses:
    Problem:
      description: RFC 9457; 400 entrada inválida, 401 sin sesión, 403 sin permiso, 404 módulo inactivo o registro ausente, 409 conflicto o límite de exportación, 413 tamaño, 428 requiere TOTP, 429 cuota, 503 concurrencia/timeout. Reutiliza identidad, origen exacto y CSRF del Core.
      content:
        application/problem+json:
          schema:
            type: object
            required: [type, title, status, detail]
            properties:
              type: {type: string}
              title: {type: string}
              status: {type: integer}
              detail: {type: string}
