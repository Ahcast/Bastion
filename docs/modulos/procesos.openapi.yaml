openapi: 3.1.0
info:
  title: Bastion Procesos (contrato del módulo habilitado)
  version: 0.1.0
security:
  - session: []
paths:
  /api/v1/procesos/status:
    get:
      operationId: procesosStatus
      x-permission: procesos/consulta/ver
      parameters:
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Entidad'
        - $ref: '#/components/parameters/Marked'
        - $ref: '#/components/parameters/HideMunicipalities'
        - $ref: '#/components/parameters/Desde'
        - $ref: '#/components/parameters/Hasta'
      responses:
        '200':
          description: Total filtrado, última importación global, seis semanas desde lunes según primera_deteccion y entregas de hoy, mañana y pasado mañana según fecha_recepcion. Calendario America/Tegucigalpa. No depende de la página visible.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Status'}
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/procesos/entities:
    get:
      operationId: procesosEntities
      x-permission: procesos/consulta/ver
      responses:
        '200':
          description: Entidades distintas del histórico CSV, ordenadas por nombre y excluyendo nombres municipales. Independiente de los filtros activos. Máximo 5000; se rechaza el exceso sin truncar.
          content:
            application/json:
              schema:
                type: object
                required: [entities]
                properties:
                  entities:
                    type: array
                    maxItems: 5000
                    items: {type: string, maxLength: 500}
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/procesos/rows:
    get:
      operationId: procesosRows
      x-permission: procesos/consulta/ver
      parameters:
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Entidad'
        - $ref: '#/components/parameters/Desde'
        - $ref: '#/components/parameters/Hasta'
        - $ref: '#/components/parameters/Marked'
        - $ref: '#/components/parameters/HideMunicipalities'
        - $ref: '#/components/parameters/Sort'
        - name: page
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: page_size
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 25}
      responses:
        '200':
          description: items, page, page_size y has_more. Orden solicitado y proceso_id ASC como desempate estable. Campos de fecha en UTC RFC 3339.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Page'}
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/procesos/rows/{id}:
    get:
      operationId: procesosDetail
      x-permission: procesos/consulta/ver
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, pattern: '^hc:[a-f0-9]{64}$'}
      responses:
        '200':
          description: Registro con campos fuente completos, marked, note y version compartidos; ETag con versión. Resultado IA como texto/JSON; no descarga enlaces externos.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Process'}
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/procesos/rows/{id}/review:
    patch:
      operationId: procesosReview
      x-permission: procesos/marcas/editar para marked; procesos/notas/editar para note
      description: Marca y nota compartidas. Conservadas al importar Scout. Al menos un campo requerido; no permite campos fuente ni actor. Auditoría sin texto de nota.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, pattern: '^hc:[a-f0-9]{64}$'}
        - name: If-Match
          in: header
          required: true
          description: Versión del registro entre comillas, recibida en ETag/version del detalle/listado.
          schema: {type: string}
        - name: X-CSRF-Token
          in: header
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                marked: {type: boolean}
                note: {type: string, maxLength: 10000}
      responses:
        '200':
          description: marked, note y version actualizados; ETag nuevo.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Review'}
        '412':
          description: Otro usuario cambió la revisión; recargar. No sobrescribe.
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/procesos/refresh:
    post:
      operationId: procesosRefresh
      x-permission: procesos/importacion/editar
      x-limits: {csv_bytes: 8388608, request_bytes: 1048576, rows: 5000, timeout_seconds: 60, concurrency: 1}
      description: Actualizar incorpora el maestro local configurado en el servidor tras verificar main.json, finalización, SHA-256 y cantidad de filas. No acepta rutas ni CSV. Auditoría e idempotencia por usuario y SHA-256. Repetir devuelve el recibo previo; ausencias no borran filas ni marcas/notas. Funciona sin el trabajador periódico. Sustituye el endpoint de carga de archivos.
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              maxProperties: 0
      responses:
        '200':
          description: import_id, inserted, updated, unchanged, stale y replayed. Confirmación transaccional con auditoría.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportResult'}
        '409':
          description: Scout todavía no terminó o la entrega cambió durante la lectura; reintentar después.
        '422':
          description: El maestro o manifiesto no cumple el contrato; no se importó ninguna fila.
        '503':
          description: La fuente local no está disponible o no tiene permisos de lectura.
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/procesos/export:
    get:
      operationId: procesosExport
      x-permission: procesos/exportacion/ver
      x-limits: {rows: 5000, response_bytes: 16777216, timeout_seconds: 60, concurrency: 1}
      parameters:
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Entidad'
        - $ref: '#/components/parameters/Desde'
        - $ref: '#/components/parameters/Hasta'
        - $ref: '#/components/parameters/Marked'
        - $ref: '#/components/parameters/HideMunicipalities'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: JSON csv_text con CSV UTF-8 BOM, encabezados Scout seguidos de de_interes (0/1) y nota compartida; celdas potencialmente ejecutables en hojas de cálculo prefijadas con apóstrofo. Esta exportación es para consulta y no sustituye el maestro original de Scout.
          content:
            application/json:
              schema:
                type: object
                required: [csv_text]
                properties:
                  csv_text: {type: string}
        '409':
          description: Más de 5.000 filas o 16 MiB; acotar filtros. No se trunca el resultado.
        default:
          $ref: '#/components/responses/Problem'
components:
  schemas:
    Status:
      type: object
      required: [total, last_import_at, as_of, timezone, due, weekly]
      properties:
        total: {type: integer, minimum: 0}
        last_import_at: {type: [string, 'null'], format: date-time}
        as_of: {type: string, format: date}
        timezone: {type: string, const: America/Tegucigalpa}
        due:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: object
            required: [date, count]
            properties:
              date: {type: string, format: date}
              count: {type: integer, minimum: 0}
        weekly:
          type: array
          minItems: 6
          maxItems: 6
          items:
            type: object
            required: [week_start, count]
            properties:
              week_start: {type: string, format: date}
              count: {type: integer, minimum: 0}
    Review:
      type: object
      required: [marked, note, version]
      properties:
        marked: {type: boolean}
        note: {type: string, maxLength: 10000}
        version: {type: integer, minimum: 0}
    Process:
      allOf:
        - $ref: '#/components/schemas/Review'
        - type: object
          required: [proceso_id, entidad, expediente, fecha_recepcion, puntaje, rubro, resumen_corto, source]
          properties:
            proceso_id: {type: string, pattern: '^hc:[a-f0-9]{64}$'}
            entidad: {type: string, maxLength: 500}
            expediente: {type: string, maxLength: 255}
            fecha_recepcion: {type: string, format: date-time}
            puntaje: {type: integer, minimum: 0, maximum: 100}
            rubro: {type: string, maxLength: 500}
            resumen_corto: {type: string, maxLength: 16384}
            source:
              type: object
              description: Vacío en listados; las 24 columnas de Scout con sus textos exactos en el detalle. Scout actual usa resumen e items numerados; el formato anterior usa resumen_corto e items JSON. items_fuente conserva JSON serializado como texto.
              additionalProperties: {type: string}
    Page:
      type: object
      required: [items, page, page_size, has_more]
      properties:
        items:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/Process'}
        page: {type: integer, minimum: 1, maximum: 100000}
        page_size: {type: integer, minimum: 1, maximum: 100}
        has_more: {type: boolean}
    ImportResult:
      type: object
      required: [import_id, inserted, updated, unchanged, stale, replayed]
      properties:
        import_id: {type: integer, minimum: 1}
        inserted: {type: integer, minimum: 0}
        updated: {type: integer, minimum: 0}
        unchanged: {type: integer, minimum: 0}
        stale: {type: integer, minimum: 0}
        replayed: {type: boolean}
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-bastion_session
  parameters:
    HideMunicipalities:
      name: hide_municipalities
      in: query
      schema: {type: boolean, default: false}
      description: Excluye entidades con palabras municipalidad(es), alcaldía(s), municipio(s) o municipal(es) en su nombre; no deduce localidad por expediente.
    Sort:
      name: sort
      in: query
      schema: {type: string, enum: [fecha_desc, fecha_asc, puntaje_desc, puntaje_asc], default: fecha_desc}
    Marked:
      name: marked
      in: query
      schema: {type: boolean}
    Q:
      name: q
      in: query
      schema: {type: string, maxLength: 200}
      description: Texto literal en expediente, descripción e items_fuente del CSV; estos dos últimos son el contenido fuente disponible para especificaciones. No busca por texto IA.
    Entidad:
      name: entidad
      in: query
      schema: {type: string, maxLength: 500}
      description: Coincidencia exacta del nombre seleccionado.
    Desde:
      name: desde
      in: query
      description: Primer día de recepción, inclusivo en America/Tegucigalpa.
      schema: {type: string, format: date}
    Hasta:
      name: hasta
      in: query
      description: Último día de recepción, inclusivo en America/Tegucigalpa.
      schema: {type: string, format: date}
  responses:
    Problem:
      description: RFC 9457; 400 entrada inválida, 401 sin sesión, 403 sin permiso, 404 módulo inactivo o registro ausente, 409 conflicto o límite de exportación, 413 tamaño, 428 requiere TOTP, 429 cuota, 503 concurrencia/timeout. Reutiliza identidad, origen exacto y CSRF del Core.
      content:
        application/problem+json:
          schema:
            type: object
            required: [type, title, status, detail]
            properties:
              type: {type: string}
              title: {type: string}
              status: {type: integer}
              detail: {type: string}
