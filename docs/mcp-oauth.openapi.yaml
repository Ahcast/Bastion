openapi: 3.1.0
info:
  title: Bastion OAuth para MCP — borrador no publicado
  version: 0.1.0
  description: >-
    Contrato en preparación. Ninguna ruta se anuncia ni habilita hasta completar
    consentimiento, autorización vigente, auditoría, límites y verificación.
paths:
  /oauth/clients/request:
    post:
      summary: Solicitar revisión de un cliente MCP — borrador aislado
      description: Requiere sesión, origen y CSRF; obtiene y valida metadatos y no crea grants.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id, scopes]
              properties:
                client_id: { type: string, maxLength: 2048 }
                scopes: { type: array, minItems: 1, maxItems: 64, items: { type: string } }
              additionalProperties: false
      responses:
        '200': { description: Solicitud pendiente de revisión. }
        '400': { description: Cliente o alcances inválidos. }
        '403': { description: Sesión, origen o CSRF rechazados. }
        '409': { description: Solicitud en conflicto o cliente ya autorizado. }
        '429': { description: Límite de concurrencia alcanzado. }
        '503': { description: Servicio temporalmente indisponible. }
  /oauth/clients/mine:
    post:
      summary: Consultar solicitudes propias — borrador aislado
      responses:
        '200': { description: Página de solicitudes del usuario. }
        '403': { description: Sesión, origen o CSRF rechazados. }
  /oauth/clients/pending:
    post:
      summary: Consultar cola administrativa — borrador aislado
      responses:
        '200': { description: Página de solicitudes pendientes. }
        '403': { description: Requiere administrador con sesión vigente. }
  /oauth/clients/review:
    post:
      summary: Aprobar o rechazar una solicitud — borrador aislado
      description: Revalida la sesión de administrador y, para aprobar, vuelve a obtener la ficha exacta del cliente.
      responses:
        '200': { description: Solicitud revisada; no concede datos a usuarios. }
        '400': { description: Solicitud o ficha inválida. }
        '403': { description: Requiere administrador con sesión vigente. }
        '409': { description: Solicitud o ficha en conflicto. }
        '503': { description: Servicio temporalmente indisponible. }
  /oauth/consent/begin:
    post:
      summary: Preparar consentimiento en la sesión del usuario — borrador
      description: >-
        Requiere sesión, origen y CSRF verificados; valida cliente, recurso,
        redirección, PKCE y permisos. No crea un grant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [authorization_query]
              properties:
                authorization_query: { type: string, maxLength: 8192 }
              additionalProperties: false
      responses:
        '200': { description: Solicitud de consentimiento ligada a la sesión, con nombre y alcances. }
        '400': { description: Solicitud inválida o cliente no aprobado. }
        '401': { description: Sesión no autorizada. }
        '403': { description: Origen o CSRF inválido. }
        '503': { description: Servicio temporalmente indisponible. }
  /oauth/consent/decision:
    post:
      summary: Aprobar o rechazar consentimiento explícitamente — borrador
      description: >-
        Requiere la misma sesión, origen y CSRF; vuelve a validar el cliente,
        los permisos y la dirección antes de responder. La respuesta es privada.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [handle, decision]
              properties:
                handle: { type: string }
                decision: { enum: [approve, deny] }
              additionalProperties: false
      responses:
        '200': { description: Redirección validada al cliente, sin almacenamiento en caché. }
        '400': { description: Solicitud inválida, consumida o vencida. }
        '401': { description: Sesión no autorizada. }
        '403': { description: Origen o CSRF inválido. }
        '503': { description: Servicio temporalmente indisponible. }
  /.well-known/oauth-protected-resource/mcp:
    get:
      summary: Metadatos del recurso MCP — ruta de ejemplo aislada
      description: La ruta real depende del identificador de recurso configurado; todavía no se publica.
      responses:
        '200': { description: Identificador del recurso y servidor de autorización. }
  /.well-known/oauth-authorization-server/oauth:
    get:
      summary: Metadatos del servidor OAuth — ruta de ejemplo aislada
      description: La ruta real depende del emisor configurado; todavía no se publica.
      responses:
        '200': { description: Emisor y capacidades implementadas del servidor OAuth. }
  /mcp:
    post:
      summary: Descubrimiento MCP — borrador aislado
      description: >-
        Ruta no habilitada en la aplicación. Valida autorización y límites,
        y ofrece únicamente descubrimiento y listado de herramientas registradas;
        no ejecuta operaciones de dominio.
      parameters:
        - in: header
          name: Authorization
          required: true
          schema: { type: string }
        - in: header
          name: MCP-Protocol-Version
          required: true
          schema: { type: string }
        - in: header
          name: MCP-Method
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: Respuesta JSON-RPC de descubrimiento. }
        '400': { description: Solicitud o cabeceras inválidas. }
        '401': { description: Credencial ausente o inválida. }
        '403': { description: Origen de navegador no permitido. }
        '413': { description: Cuerpo mayor al límite de 65536 bytes. }
        '429': { description: Cuota o concurrencia agotada. }
        '503': { description: Servicio temporalmente indisponible. }
  /oauth/token:
    post:
      summary: Canjear un código PKCE o rotar un refresh token
      description: >-
        Borrador para clientes públicos previamente aprobados. El servidor
        vincula cada credencial al cliente, recurso y grant; revalida permisos y
        revoca el grant ante reutilización. Los cuerpos y tokens no se registran.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type, client_id, resource]
              properties:
                grant_type:
                  enum: [authorization_code, refresh_token]
                client_id: { type: string, maxLength: 2048 }
                resource: { type: string, maxLength: 2048 }
                code: { type: string, minLength: 43, maxLength: 43 }
                redirect_uri: { type: string, maxLength: 2048 }
                code_verifier: { type: string, minLength: 43, maxLength: 128 }
                refresh_token: { type: string, minLength: 43, maxLength: 43 }
                scope: { type: string, maxLength: 2048 }
      responses:
        '200':
          description: Tokens opacos; Cache-Control no-store y Pragma no-cache.
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, expires_in, refresh_token, scope]
                properties:
                  access_token: { type: string }
                  token_type: { const: Bearer }
                  expires_in: { type: integer, minimum: 1, maximum: 900 }
                  refresh_token: { type: string }
                  scope: { type: string }
        '400': { description: Solicitud o grant inválido, sin detalles internos. }
        '403': { description: Origen de navegador no permitido. }
        '413': { description: Cuerpo mayor al límite de 8192 bytes. }
        '503': { description: Servicio temporalmente indisponible. }
