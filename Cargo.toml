[workspace]
members = ["apps/server", "crates/api", "crates/core", "crates/mcp", "crates/modules/procesos", "crates/modules/cotizaciones", "crates/modules/clientes", "crates/modules/ordenes_compra", "crates/modules/facturas", "crates/workflows"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
axum = "0.8.9"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
csv = "1.4"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
data-encoding = "2.6"
dotenvy = "0.15"
hmac = "0.12"
hex = "0.4"
ipnet = "2.11"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls"] }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "mysql", "tls-rustls-ring-native-roots", "chrono", "json", "migrate", "macros"] }
subtle = "2.6"
tokio = { version = "1.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.7.1", features = ["cors", "limit", "request-id", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5"
