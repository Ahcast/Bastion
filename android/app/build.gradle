plugins { id 'com.android.application' }

android {
    namespace 'net.castilloit.bastion'
    compileSdk 36
    defaultConfig {
        applicationId 'net.castilloit.bastion'
        minSdk 24
        targetSdk 36
        versionCode 3
        versionName '0.2.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildTypes {
        debug {
            applicationIdSuffix '.preview'
            versionNameSuffix '-preview'
            resValue 'string', 'app_name', 'Bastion Preview'
        }
        release {
            minifyEnabled false
            resValue 'string', 'app_name', 'Bastion'
            // Sign externally with the owner's durable key; never commit it.
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError true }
}

dependencies {
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'junit:junit:4.13.2'
}
