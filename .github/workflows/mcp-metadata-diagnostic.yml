name: Temporary MCP metadata diagnostic build
on:
  push:
    branches: [codex/mcp-metadata-diagnostic]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.99.1
      - name: Build read-only metadata diagnostic
        run: cargo build --locked --release -p bastion-mcp-http --example cursor_metadata_diagnostic
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cursor-metadata-diagnostic
          path: target/release/examples/cursor_metadata_diagnostic
          if-no-files-found: error
          retention-days: 1
