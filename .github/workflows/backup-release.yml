name: Backup release without fixtures
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  package:
    if: contains(github.event.head_commit.message, '[backup-release]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.99.1
          components: rustfmt
      - name: Validate source without creating users or data fixtures
        run: |
          python3 -c "import ast,pathlib; [ast.parse(p.read_text()) for p in pathlib.Path('deploy').glob('bastion_backup_*.py')]"
          cargo build --locked --release --package bastion-server --target x86_64-unknown-linux-gnu
      - name: Package backend and backup worker
        run: |
          mkdir -p dist/package/backup
          cp target/x86_64-unknown-linux-gnu/release/bastion-server dist/package/
          cp deploy/bastion_backup_*.py deploy/bastion-backup-control.service deploy/bastion-mysql-backup.service deploy/bastion-mysql-backup.timer deploy/bastion-backup-retention.json dist/package/backup/
          cp Cargo.lock .env.example dist/package/
          git rev-parse HEAD > dist/package/BUILD.txt
          (cd dist/package && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          tar -czf dist/bastion-server-linux-x86_64.tar.gz -C dist/package .
          (cd dist && sha256sum bastion-server-linux-x86_64.tar.gz > bastion-server-linux-x86_64.tar.gz.sha256)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bastion-server-linux-x86_64
          path: |
            dist/bastion-server-linux-x86_64.tar.gz
            dist/bastion-server-linux-x86_64.tar.gz.sha256
          retention-days: 30
