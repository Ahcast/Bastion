name: Temporary lot format preview
on:
  push:
    branches: [codex/licitaciones-lotes-wip]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.99.1
          components: rustfmt
      - run: cargo fmt --all && git diff --binary > rustfmt.patch
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: lots-rustfmt-patch
          path: rustfmt.patch
          if-no-files-found: error
          retention-days: 1
