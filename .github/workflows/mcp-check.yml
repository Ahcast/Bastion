name: MCP MySQL checks

on:
  push:
    branches: [main]
    paths:
      - 'deploy/bastion-mcp-egress*'
      - 'tests/test_mcp_egress.py'
      - 'tests/mcp-client/**'
      - 'apps/server/**'
      - 'crates/mcp/**'
      - 'crates/mcp-core/**'
      - 'crates/mcp-http/**'
      - 'crates/core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/mcp-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'deploy/bastion-mcp-egress*'
      - 'tests/test_mcp_egress.py'
      - 'tests/mcp-client/**'
      - 'apps/server/**'
      - 'crates/mcp/**'
      - 'crates/mcp-core/**'
      - 'crates/mcp-http/**'
      - 'crates/core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/mcp-check.yml'

permissions:
  contents: read

jobs:
  mysql57:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: bastion_mcp_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      BASTION_MCP_TEST_URL: mysql://root@127.0.0.1:3306/bastion_mcp_test?ssl-mode=disabled
      BASTION_MCP_SDK_TEST: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.99.1
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.19.0'
      - name: Install pinned MCP SDK
        working-directory: tests/mcp-client
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test egress guard safety and rollback
        run: python3 tests/test_mcp_egress.py
      - name: Test MCP against disposable MySQL 5.7
        env:
          BASTION_DOCUMENTS_ENABLED: 'true'
          BASTION_AWS_CLI: ${{ github.workspace }}/crates/modules/cotizaciones/tests/fixtures/private_storage.py
          BASTION_TYPST_BIN: ${{ github.workspace }}/crates/mcp-core/tests/fixtures/typst.py
          BASTION_DOCUMENTS_BUCKET: bastion-synthetic-attachment-test
          BASTION_DOCUMENTS_REGION: synthetic-region
        run: |
          chmod +x crates/modules/cotizaciones/tests/fixtures/private_storage.py
          cargo test --locked --package bastion-mcp --package bastion-mcp-core --package bastion-mcp-http --package bastion-server
