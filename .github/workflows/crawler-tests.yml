name: Crawler tests
on:
  push:
    branches: [main]
    paths: ['backend/crawler/**', '.github/workflows/crawler-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/crawler
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.lock
      - run: python -m unittest discover -s tests -v


