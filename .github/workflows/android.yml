name: Android APK

on:
  push:
    branches: [main]
    paths: ['android/**', 'web/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.13'
      - name: Build and lint installable preview
        run: gradle -p android --no-daemon --console=plain :app:assembleDebug :app:lintDebug :app:assembleRelease
      - name: Verify APK and record provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/android
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/android/bastion-0.1.1-preview.apk
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk dist/android/bastion-0.1.1-unsigned.apk
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/apksigner" verify --verbose --print-certs dist/android/bastion-0.1.1-preview.apk > dist/android/SIGNATURE.txt
          "$tools/aapt" dump badging dist/android/bastion-0.1.1-preview.apk > dist/android/APK-INFO.txt
          grep -F "net.castilloit.bastion.preview" dist/android/APK-INFO.txt
          grep -F "sdkVersion:'24'" dist/android/APK-INFO.txt
          printf '%s\n' "$GITHUB_SHA" > dist/android/BUILD.txt
          cp android/INSTALL.md dist/android/INSTALL.md
          (cd dist/android && sha256sum *.apk > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bastion-android-apk
          path: dist/android/
          if-no-files-found: error
          retention-days: 30

  android-startup:
    needs: apk
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        api-level: [35, 36]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: bastion-android-apk
          path: dist/android
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch the actual APK
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 android/qa/startup.py dist/android/bastion-0.1.1-preview.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: bastion-android-startup-api-${{ matrix.api-level }}
          path: output/android-startup/
          if-no-files-found: warn
          retention-days: 30

  phone-layout:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build
        working-directory: web
      - name: Install isolated browser QA tools
        run: |
          npm install --prefix "$RUNNER_TEMP/mobile-qa" --no-save playwright@1.56.1
          node "$RUNNER_TEMP/mobile-qa/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Check phone and desktop layouts
        run: NODE_PATH="$RUNNER_TEMP/mobile-qa/node_modules" node web/qa/mobile.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: bastion-phone-layout
          path: output/android-qa/
          if-no-files-found: warn
          retention-days: 30
