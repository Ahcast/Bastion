name: Core checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install pinned frontend dependencies
        working-directory: web
        run: npm ci --ignore-scripts
      - name: Verify frontend types, security regressions and production build
        working-directory: web
        run: |
          npm run typecheck
          npm test
          npm run build
          npm audit --omit=dev --audit-level=high
      - name: Package static frontend
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > web/dist/BUILD.txt
          node --version >> web/dist/BUILD.txt
          cd web/dist
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          cd ../..
          mkdir -p dist
          tar -czf dist/bastion-web-static.tar.gz -C web/dist .
          cd dist
          sha256sum bastion-web-static.tar.gz > bastion-web-static.tar.gz.sha256
      - name: Upload static frontend
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bastion-web-static
          path: |
            dist/bastion-web-static.tar.gz
            dist/bastion-web-static.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.99.1
          components: rustfmt
      - name: Verify rustfmt output
        run: cargo fmt --all -- --check

  compile-and-test:
    runs-on: ubuntu-24.04
    needs: format
    timeout-minutes: 30
    services:
      mysql57:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: bastion_ci_only
          MYSQL_DATABASE: bastion_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pbastion_ci_only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      BASTION_LICITACIONES_TEST_URL: mysql://root:bastion_ci_only@127.0.0.1:3306/bastion_licitaciones_test?ssl-mode=disabled
      BASTION_LICITACIONES_HTTP_TEST_URL: mysql://root:bastion_ci_only@127.0.0.1:3306/bastion_licitaciones_http_test?ssl-mode=disabled
      BASTION_CONVERSIONS_TEST_URL: mysql://root:bastion_ci_only@127.0.0.1:3306/bastion_conversions_test?ssl-mode=disabled
      BASTION_CONVERSIONS_HTTP_TEST_URL: mysql://root:bastion_ci_only@127.0.0.1:3306/bastion_conversions_http_test?ssl-mode=disabled
      BASTION_CORE_TEST_URL: mysql://root:bastion_ci_only@127.0.0.1:3306/bastion_core_test?ssl-mode=disabled
      BASTION_PROCESOS_TEST_URL: mysql://root:bastion_ci_only@127.0.0.1:3306/bastion_test?ssl-mode=disabled
      BASTION_COTIZACIONES_TEST_URL: mysql://root:bastion_ci_only@127.0.0.1:3306/bastion_cotizaciones_test?ssl-mode=disabled
      BASTION_CLIENTES_TEST_URL: mysql://root:bastion_ci_only@127.0.0.1:3306/bastion_clientes_test?ssl-mode=disabled
      BASTION_ORDENES_TEST_URL: mysql://root:bastion_ci_only@127.0.0.1:3306/bastion_ordenes_test?ssl-mode=disabled
      BASTION_ORDENES_HTTP_TEST_URL: mysql://root:bastion_ci_only@127.0.0.1:3306/bastion_ordenes_http_test?ssl-mode=disabled
      BASTION_CLIENTES_HTTP_TEST_URL: mysql://root:bastion_ci_only@127.0.0.1:3306/bastion_clientes_http_test?ssl-mode=disabled
      BASTION_GASTOS_TEST_URL: mysql://root:bastion_ci_only@127.0.0.1:3306/bastion_gastos_test?ssl-mode=disabled
      BASTION_GASTOS_HTTP_TEST_URL: mysql://root:bastion_ci_only@127.0.0.1:3306/bastion_gastos_http_test?ssl-mode=disabled
      BASTION_REPORTES_HTTP_TEST_URL: mysql://root:bastion_ci_only@127.0.0.1:3306/bastion_reportes_http_test?ssl-mode=disabled
      BASTION_COLABORACION_TEST_URL: mysql://root:bastion_ci_only@127.0.0.1:3306/bastion_colaboracion_test?ssl-mode=disabled
      BASTION_COLABORACION_HTTP_TEST_URL: mysql://root:bastion_ci_only@127.0.0.1:3306/bastion_colaboracion_http_test?ssl-mode=disabled
      BASTION_FACTURAS_TEST_URL: mysql://root:bastion_ci_only@127.0.0.1:3306/bastion_facturas_test?ssl-mode=disabled
      BASTION_FACTURAS_HTTP_TEST_URL: mysql://root:bastion_ci_only@127.0.0.1:3306/bastion_facturas_http_test?ssl-mode=disabled
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.99.1
          components: rustfmt
      - name: Compile workspace
        run: cargo check --workspace --locked
      - name: Prepare isolated Cotizaciones test database
        run: docker exec ${{ job.services.mysql57.id }} mysql -uroot -pbastion_ci_only -e 'CREATE DATABASE bastion_cotizaciones_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'
      - name: Prepare isolated invitation test database
        run: docker exec ${{ job.services.mysql57.id }} mysql -uroot -pbastion_ci_only -e 'CREATE DATABASE bastion_core_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'
      - name: Install pinned PDF compiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bastion-typst"
          curl -fsSL https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz -o "$RUNNER_TEMP/typst.tar.xz"
          echo "a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c  $RUNNER_TEMP/typst.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/typst.tar.xz" --strip-components=1 -C "$RUNNER_TEMP/bastion-typst"
          echo "BASTION_TYPST_BIN=$RUNNER_TEMP/bastion-typst/typst" >> "$GITHUB_ENV"
          echo "BASTION_DOCUMENTS_WORK_DIR=$RUNNER_TEMP/bastion-documents" >> "$GITHUB_ENV"
      - name: Run workspace tests
        # Shared PDF template runs with synthetic data and no S3 or SMTP credentials.
        # Each module uses an isolated disposable MySQL 5.7 database.
        run: |
          docker exec ${{ job.services.mysql57.id }} mysql -uroot -pbastion_ci_only -e 'CREATE DATABASE bastion_clientes_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'
          docker exec ${{ job.services.mysql57.id }} mysql -uroot -pbastion_ci_only -e 'CREATE DATABASE bastion_clientes_http_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'
          docker exec ${{ job.services.mysql57.id }} mysql -uroot -pbastion_ci_only -e 'CREATE DATABASE bastion_colaboracion_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'
          docker exec ${{ job.services.mysql57.id }} mysql -uroot -pbastion_ci_only -e 'CREATE DATABASE bastion_colaboracion_http_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'
          docker exec ${{ job.services.mysql57.id }} mysql -uroot -pbastion_ci_only -e 'CREATE DATABASE bastion_facturas_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'
          docker exec ${{ job.services.mysql57.id }} mysql -uroot -pbastion_ci_only -e 'CREATE DATABASE bastion_facturas_http_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'
          docker exec ${{ job.services.mysql57.id }} mysql -uroot -pbastion_ci_only -e 'CREATE DATABASE bastion_ordenes_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'
          docker exec ${{ job.services.mysql57.id }} mysql -uroot -pbastion_ci_only -e 'CREATE DATABASE bastion_ordenes_http_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'
          docker exec ${{ job.services.mysql57.id }} mysql -uroot -pbastion_ci_only -e 'CREATE DATABASE bastion_conversions_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; CREATE DATABASE bastion_conversions_http_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'
          docker exec ${{ job.services.mysql57.id }} mysql -uroot -pbastion_ci_only -e 'CREATE DATABASE bastion_gastos_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; CREATE DATABASE bastion_gastos_http_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'
          docker exec ${{ job.services.mysql57.id }} mysql -uroot -pbastion_ci_only -e 'CREATE DATABASE bastion_reportes_http_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'
          docker exec ${{ job.services.mysql57.id }} mysql -uroot -pbastion_ci_only -e 'CREATE DATABASE bastion_licitaciones_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; CREATE DATABASE bastion_licitaciones_http_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'
          cargo test --workspace --locked
      - name: Verify private attachments with isolated databases and local storage transport
        env:
          BASTION_DOCUMENTS_ENABLED: 'true'
          BASTION_AWS_CLI: ${{ github.workspace }}/crates/modules/cotizaciones/tests/fixtures/private_storage.py
          BASTION_DOCUMENTS_BUCKET: bastion-synthetic-attachment-test
          BASTION_DOCUMENTS_REGION: synthetic-region
          BASTION_COTIZACIONES_ATTACHMENTS_TEST_URL: mysql://root:bastion_ci_only@127.0.0.1:3306/bastion_attachments_test?ssl-mode=disabled
          BASTION_COTIZACIONES_ATTACHMENT_HTTP_TEST_URL: mysql://root:bastion_ci_only@127.0.0.1:3306/bastion_attachments_http_test?ssl-mode=disabled
        run: |
          docker exec ${{ job.services.mysql57.id }} mysql -uroot -pbastion_ci_only -e 'CREATE DATABASE bastion_attachments_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; CREATE DATABASE bastion_attachments_http_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'
          chmod +x crates/modules/cotizaciones/tests/fixtures/private_storage.py
          cargo test --locked --package bastion-cotizaciones --test attachments
          cargo test --locked --package bastion-api mysql57_attachment_http
      - name: Verify purchase order actions with MySQL 5.7 and private storage
        env:
          BASTION_DOCUMENTS_ENABLED: 'true'
          BASTION_AWS_CLI: ${{ github.workspace }}/crates/modules/cotizaciones/tests/fixtures/private_storage.py
          BASTION_DOCUMENTS_BUCKET: bastion-synthetic-attachment-test
          BASTION_DOCUMENTS_REGION: synthetic-region
          BASTION_ORDER_ACTIONS_TEST_URL: mysql://root:bastion_ci_only@127.0.0.1:3306/bastion_order_actions_test?ssl-mode=disabled
        run: |
          docker exec ${{ job.services.mysql57.id }} mysql -uroot -pbastion_ci_only -e 'CREATE DATABASE bastion_order_actions_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'
          chmod +x crates/modules/cotizaciones/tests/fixtures/private_storage.py
          cargo test --locked --package bastion-document-flows --test order_actions
      - name: Build Lightsail executable
        run: cargo build --release --locked --package bastion-server --target x86_64-unknown-linux-gnu
      - name: Verify executable starts
        shell: bash
        run: |
          set -euo pipefail
          executable=target/x86_64-unknown-linux-gnu/release/bastion-server
          file "$executable"
          ldd "$executable"
          if "$executable" invalid-command > startup-check.txt 2>&1; then
            echo "Expected unknown command to be rejected"
            exit 1
          fi
          grep -F 'unknown command' startup-check.txt
      - name: Package Lightsail executable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/package
          cp target/x86_64-unknown-linux-gnu/release/bastion-server dist/package/
          cp Cargo.lock .env.example dist/package/
          git rev-parse HEAD > dist/package/BUILD.txt
          rustc --version >> dist/package/BUILD.txt
          echo "Target: x86_64-unknown-linux-gnu; Ubuntu 24.04" >> dist/package/BUILD.txt
          cd dist/package
          sha256sum bastion-server > SHA256SUMS
          cd ..
          tar -czf bastion-server-linux-x86_64.tar.gz -C package .
          sha256sum bastion-server-linux-x86_64.tar.gz > bastion-server-linux-x86_64.tar.gz.sha256
      - name: Upload Lightsail package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bastion-server-linux-x86_64
          path: |
            dist/bastion-server-linux-x86_64.tar.gz
            dist/bastion-server-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
