name: Core checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install pinned frontend dependencies
        working-directory: web
        run: npm ci --ignore-scripts
      - name: Verify frontend types, security regressions and production build
        working-directory: web
        run: |
          npm run typecheck
          npm test
          npm run build
          npm audit --omit=dev --audit-level=high
      - name: Package static frontend
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > web/dist/BUILD.txt
          node --version >> web/dist/BUILD.txt
          cd web/dist
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          cd ../..
          mkdir -p dist
          tar -czf dist/bastion-web-static.tar.gz -C web/dist .
          cd dist
          sha256sum bastion-web-static.tar.gz > bastion-web-static.tar.gz.sha256
      - name: Upload static frontend
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bastion-web-static
          path: |
            dist/bastion-web-static.tar.gz
            dist/bastion-web-static.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.99.1
          components: rustfmt
      - name: Verify rustfmt output
        run: cargo fmt --all -- --check

  compile-and-test:
    runs-on: ubuntu-24.04
    needs: format
    timeout-minutes: 30
    services:
      mysql57:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: bastion_ci_only
          MYSQL_DATABASE: bastion_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pbastion_ci_only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      BASTION_CORE_TEST_URL: mysql://root:bastion_ci_only@127.0.0.1:3306/bastion_core_test?ssl-mode=disabled
      BASTION_PROCESOS_TEST_URL: mysql://root:bastion_ci_only@127.0.0.1:3306/bastion_test?ssl-mode=disabled
      BASTION_COTIZACIONES_TEST_URL: mysql://root:bastion_ci_only@127.0.0.1:3306/bastion_cotizaciones_test?ssl-mode=disabled
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.99.1
          components: rustfmt
      - name: Compile workspace
        run: cargo check --workspace --locked
      - name: Prepare isolated Cotizaciones test database
        run: docker exec ${{ job.services.mysql57.id }} mysql -uroot -pbastion_ci_only -e 'CREATE DATABASE bastion_cotizaciones_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'
      - name: Prepare isolated invitation test database
        run: docker exec ${{ job.services.mysql57.id }} mysql -uroot -pbastion_ci_only -e 'CREATE DATABASE bastion_core_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'
      - name: Run workspace tests
        run: cargo test --workspace --locked
      - name: Build Lightsail executable
        run: cargo build --release --locked --package bastion-server --target x86_64-unknown-linux-gnu
      - name: Verify executable starts
        shell: bash
        run: |
          set -euo pipefail
          executable=target/x86_64-unknown-linux-gnu/release/bastion-server
          file "$executable"
          ldd "$executable"
          if "$executable" invalid-command > startup-check.txt 2>&1; then
            echo "Expected unknown command to be rejected"
            exit 1
          fi
          grep -F 'unknown command' startup-check.txt
      - name: Package Lightsail executable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/package
          cp target/x86_64-unknown-linux-gnu/release/bastion-server dist/package/
          cp Cargo.lock .env.example dist/package/
          git rev-parse HEAD > dist/package/BUILD.txt
          rustc --version >> dist/package/BUILD.txt
          echo "Target: x86_64-unknown-linux-gnu; Ubuntu 24.04" >> dist/package/BUILD.txt
          cd dist/package
          sha256sum bastion-server > SHA256SUMS
          cd ..
          tar -czf bastion-server-linux-x86_64.tar.gz -C package .
          sha256sum bastion-server-linux-x86_64.tar.gz > bastion-server-linux-x86_64.tar.gz.sha256
      - name: Upload Lightsail package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bastion-server-linux-x86_64
          path: |
            dist/bastion-server-linux-x86_64.tar.gz
            dist/bastion-server-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
